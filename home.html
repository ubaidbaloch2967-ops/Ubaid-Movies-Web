<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloch Moviz | Trending Now</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root { --neon: #f967fb; --bg: #0f101a; --card: #1e1f2b; }
        body { background: var(--bg) !important; color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* Neon Navbar */
        nav { background: #000 !important; border-bottom: 2px solid var(--neon); box-shadow: 0 0 10px var(--neon); }
        .navbar-brand { font-weight: bold; color: var(--neon) !important; letter-spacing: 2px; }
        
        /* Trending Header */
        .trending-bar { background: #161722; padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        .trending-label { color: black; background: var(--neon); border-radius: 20px; padding: 5px 25px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }

        /* Movie Grid & Pink Buttons */
        .movie-card { padding: 12px; }
        .movie-container { background: var(--card); border-radius: 12px; border: 1px solid #333; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .movie-info { background: #111; padding: 10px; text-align: center; }
        .movie-title { font-size: 0.8rem; font-weight: bold; height: 35px; overflow: hidden; color: #fff; }
        .btn-download-now { background: var(--neon); color: black !important; border: none; width: 100%; font-size: 0.75rem; font-weight: bold; padding: 8px; text-transform: uppercase; }

        /* LinksZilla Styled Modal */
        .modal-content { background: #161722; border: 2px solid var(--neon); border-radius: 20px; }
        .dl-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; font-weight: bold; color: white !important; text-decoration: none !important; }
        .b-1080 { background: #8e44ad; } .b-720 { background: #2980b9; } .b-480 { background: #c0392b; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand">BALOCH MOVIZ</a>
            <form id="search-form" class="form-inline ml-auto">
                <input id="search-input" class="form-control form-control-sm bg-dark text-white border-secondary" type="search" placeholder="Search trending...">
            </form>
        </div>
    </nav>

    <div class="trending-bar">
        <span class="trending-label">🔥 Trending Movies</span>
    </div>

    <div class="container-fluid mt-4">
        <div id="movie-grid" class="row px-2">
            </div>

        <div class="d-flex justify-content-center my-5">
            <button class="btn btn-outline-info mx-2 px-4" onclick="changePage(-1)">PREV</button>
            <button class="btn btn-outline-info mx-2 px-4" onclick="changePage(1)">NEXT</button>
        </div>
    </div>

    <div class="modal fade" id="dlModal" tabindex="-1">

            <div class="modal-content p-4 text-center">
                <h6 id="m-title" class="font-weight-bold mb-3"></h6>

                <p class="small text-muted">|| Select LinksZilla Quality ||</p>

                <a href="#" id="l-480" target="_blank" class="dl-btn b-480">480p Download</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
