<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloch Moviz | Welcome</title>
    <style>
        /* Full Screen Setup */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Black', sans-serif;
            cursor: pointer; /* Click karne ka ishara */
        }

        /* Pure Screen Overlay */
        #click-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999;
            background: black;
        }

        /* Neon Animation */
        .neon-glow {
            position: absolute; width: 300px; height: 150px;
            background: transparent; z-index: -1;
            box-shadow: 0 0 40px #f967fb, 0 0 80px #f967fb;
            border-radius: 50%; filter: blur(40px);
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }

        /* Brand Text */
        h1 {
            font-size: 5rem; color: white; margin: 0;
            letter-spacing: 15px; text-transform: uppercase;
        }

        p {
            color: #777; font-size: 1.2rem; letter-spacing: 5px;
            margin-top: -10px; text-transform: lowercase;
        }

        /* Click Instruction */
        .instruction {
            margin-top: 50px; color: #555; font-size: 0.9rem;
            border: 1px solid #333; padding: 10px 25px;
            border-radius: 30px; letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body onclick="startWebsite()">

    <div id="click-layer">
        <div class="neon-glow"></div>
        <h1>BALOCH</h1>
        <p>movies</p>
        <div class="instruction">CLICK ANYWHERE TO ENTER</div>
    </div>

    <script>
        function startWebsite() {
            // Click karte hi home page par redirect karega
            window.location.href = "home.html"; 
        }
    </script>

</body>
</html>
