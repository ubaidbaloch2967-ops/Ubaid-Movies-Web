<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubaid Moviz4U - Fire</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400&display=swap" rel="stylesheet">
<style>
  body,html{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  #app{width:100%;height:100%;position:relative}
  #canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  .hero{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  
  .fire-title{
    font-family:'Anton', sans-serif;
    font-size: clamp(60px, 18vw, 150px);
    line-height:0.9;
    margin:0;
    text-transform:uppercase;
    background: url('https://media.giphy.com/media/l1J9u3TZfpfeDLkdy/giphy.gif') center;
    background-size: cover;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px #ff4500) drop-shadow(0 0 30px #ff0000);
    animation: fireMove 2s infinite;
  }
  .fire-title2{
    font-family:'Anton', sans-serif;
    font-size: clamp(50px, 15vw, 130px);
    line-height:0.9;
    margin:0;
    text-transform:uppercase;
    color:#ffae00;
    text-shadow: 0 0 10px #ff6600, 0 0 30px #ff3300, 0 0 60px #ff0000, 0 -10px 20px #ffff00;
    animation: flicker 0.15s infinite alternate;
  }
  .sub{color:#a0c0ff;font-family:Montserrat;margin-top:20px;letter-spacing:2px;font-size:16px;text-shadow:0 0 10px #00aaff}
  .btns{margin-top:30px;display:flex;gap:15px;pointer-events:auto}
  .btn{padding:10px 25px;border-radius:30px;border:2px solid #00eaff;color:#00eaff;background:transparent;text-decoration:none;font-family:Montserrat}
  .btn2{border-color:#ff8a00;color:#ff8a00}

  @keyframes flicker{0%{opacity:1;transform:scale(1)}100%{opacity:0.85;transform:scale(1.02)}}
  @keyframes fireMove{0%{filter: brightness(1)}50%{filter: brightness(1.3)}100%{filter: brightness(1)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div class="hero">
    <h1 class="fire-title">UBAID</h1>
    <h1 class="fire-title2">MOVIZ4U</h1>
    <div class="sub">Stream Movies in 4K • Action • Drama • Thriller</div>
    <div class="btns">
      <a class="btn" href="#">Watch Now</a>
      <a class="btn btn2" href="#">Explore Library</a>
    </div>
  </div>
</div>
<script type="module">
import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"
const app = TubesCursor(document.getElementById('canvas'),{
  tubes:{colors:["#00eaff","#ff00ff","#00ff88"],lights:{intensity:200,colors:["#00eaff","#ff008a","#ffae00","#60aed5"]}}
})
document.body.addEventListener('click',()=>{
  app.tubes.setColors(["#"+Math.floor(Math.random()*16777215).toString(16),"#"+Math.floor(Math.random()*16777215).toString(16),"#"+Math.floor(Math.random()*16777215).toString(16)])
})
</script>
</body>
</html>
