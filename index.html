    <style>
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Cover Background with Blur Effect */
        .header-bg {
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #000), url('https://via.placeholder.com/800x400/1e293b/FFFFFF?text=Trusted+Haji+G+Cover');
            background-size: cover;
            background-position: center;
        }

        /* Profile Lightning Glow */
        .profile-container {
            margin-top: -60px; /* Overlap with cover */
            position: relative;
            display: flex;
            justify-content: center;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            position: relative;
            z-index: 5;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        }
        .lightning-bolt {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            filter: blur(8px);
            animation: thunder 0.8s infinite alternate;
            z-index: 1;
        }
        @keyframes thunder {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 40px #f59e0b; }
        }

        /* Glassmorphism Buttons */
        .btn-link {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-link:hover {
            background: rgba(245, 158, 11, 0.1);
            border-color: #f59e0b;
            transform: scale(1.05);
        }
        .icon-box {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 20px;
            margin-right: 15px;
        }
        .verified { color: #38bdf8; margin-left: 6px; font-size: 18px; }
    </style>
</head>
