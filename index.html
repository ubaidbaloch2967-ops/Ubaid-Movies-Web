    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        /* Lightning Effect on Profile Photo */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 20px auto;
            border: 4px solid #f59e0b;
            box-shadow: 0 0 15px #f59e0b, 0 0 30px #d97706;
            animation: lightning 1.5s infinite alternate;
            object-fit: cover;
        }
        @keyframes lightning {
            0% { box-shadow: 0 0 10px #f59e0b; border-color: #f59e0b; }
            100% { box-shadow: 0 0 30px #fbbf24, 0 0 50px #f59e0b; border-color: #fbbf24; }
        }
        /* Button Styles */
        .link-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            margin: 15px 0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            font-weight: 600;
        }
        .link-card:hover {
            background: rgba(245, 158, 11, 0.2);
            transform: scale(1.03);
            border-color: #f59e0b;
        }
        .icon-box {
            width: 40px;
            height: 40px;
            background: #f59e0b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
        }
    </style>
</head>
