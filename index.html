<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Full Width Cover Photo */
        .cover-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        /* Overlapping Profile with Lightning */
        .profile-section {
            position: relative;
            margin-top: -65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
        }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            object-fit: cover;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }
        /* Lightning Aura Effect */
        .lightning-aura {
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            filter: blur(10px);
            animation: flash 1s infinite alternate;
        }
        @keyframes flash {
            0% { opacity: 0.2; transform: scale(0.95); }
            100% { opacity: 0.9; transform: scale(1.1); box-shadow: 0 0 40px #f59e0b; }
        }

        /* Buttons Style */
        .link-container { padding: 25px; }
        .action-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }
        .action-btn:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: #f59e0b;
            transform: translateY(-3px);
        }
        .icon-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(45deg, #f59e0b, #fbbf24);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 22px;
            margin-right: 18px;
        }
        .verified-icon { color: #38bdf8; margin-left: 8px; }
    </style>
</head>
