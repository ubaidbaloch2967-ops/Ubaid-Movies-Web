<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubaid Moviz4U</title>
<style>
*{user-select:none!important; -webkit-user-select:none!important; -webkit-touch-callout:none!important;}
body,html{margin:0;padding:0;width:100%;height:100%;background:black;overflow:hidden; touch-action:none;}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.box{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center; pointer-events:none;}
h1{margin:0;font-family:Arial Black, sans-serif;font-weight:900;line-height:0.9;text-align:center;}
.ubaid{font-size:85px;color:#ff3300;text-shadow:0 0 20px red, 0 0 40px orange, 0 0 80px red}
.moviz{font-size:48px; margin-top:5px; color:#ffcc00;text-shadow:0 0 15px orange, 0 0 30px red; letter-spacing:3px;}
.tag{margin-top:18px;color:#ffffff;font-family:sans-serif;letter-spacing:1px;font-size:16px;}
.btns{margin-top:35px;display:flex;gap:15px; pointer-events:auto;}
a.btn{padding:12px 26px;border:2px solid #00eaff;color:#00eaff;border-radius:30px;text-decoration:none;font-family:sans-serif;font-weight:bold}
a.btn2{border-color:#ffaa00;color:#ffaa00}
</style>
</head>
<body oncontextmenu="return false;">
<canvas id="canvas"></canvas>
<div class="box">
<h1 class="ubaid">UBAID</h1>
<h1 class="moviz">MOVIZ4U</h1>
<div class="tag">Open Website and Enjoy Movies 🍿🎥</div>
<div class="btns">
<a class="btn" href="furiosa.html">Watch Now</a>
<a class="btn btn2" href="movies.html">Explore Library</a>
</div>
</div>
<script type="module">
import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"
const app = TubesCursor(document.getElementById('canvas'),{
tubes:{colors:["#00eaff","#ff00ff","#00ff88"],lights:{intensity:200,colors:["#00eaff","#ff00aa","#ffae00","#00ae5d"]}}
})
function randomColors(){
app.tubes.setColors([`#${Math.floor(Math.random()*16777215).toString(16)}`,`#${Math.floor(Math.random()*16777215).toString(16)}`])
}
document.body.addEventListener('click',randomColors)
document.body.addEventListener('touchstart',randomColors)
</script>
</body>
</html>
