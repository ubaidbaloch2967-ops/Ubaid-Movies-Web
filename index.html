<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloch Movies | Intro</title>
    <style>
        /* --- AAPKA ORIGINAL INTRO CSS --- */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; cursor: pointer; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        .hero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; z-index: 10; pointer-events: none; }
        .hero h1 { color: white; font-size: clamp(2.5rem, 12vw, 5rem); margin: 0; letter-spacing: 10px; font-weight: bold; text-transform: uppercase; }
        .hero h3 { color: rgba(255, 255, 255, 0.5); font-size: 1rem; margin: 0 0 25px 0; letter-spacing: 4px; }
        
        /* Tap Indicator (Chota sa hint user ke liye) */
        .tap-hint { color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 20px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* --- MATCHSTICK SECTION CSS --- */
        #match-screen {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0d0f; z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .scene { position: relative; width: 60px; height: 250px; }
        .match-stick { width: 10px; height: 150px; background: #d2b48c; margin: 0 auto; border-radius: 2px; }
        .match-head { width: 16px; height: 22px; background: #800000; border-radius: 8px; margin: 0 auto; margin-bottom: -2px; position: relative; }
        .flame { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 25px; height: 50px; 
                 background: radial-gradient(circle, #ffff00, #ff4500); border-radius: 50% 50% 20% 20%; 
                 display: none; filter: blur(1px); animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* --- MAIN SITE CSS --- */
        #main-site { display: none; position: relative; z-index: 200; background: #000; min-height: 100vh; color: white; padding: 20px; text-align: center; }
    </style>
</head>
<body onclick="startExperience()"> <canvas id="bgCanvas"></canvas>
    <div class="hero" id="intro-hero">
        <h1>BALOCH</h1>
        <h3>MOVIES</h3>
        <div style="border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50px; padding: 12px 20px; color: white; display: inline-block;">
            BALOCH MOVIES DOWNLOADING WEBSITE
        </div>
        <p class="tap-hint">Tap anywhere to enter</p>
    </div>

    <div id="match-screen">
        <p style="color: rgba(255,255,255,0.5); margin-bottom: 20px;">Swipe fast to strike</p>
        <div class="scene" id="match-area">
            <div class="flame" id="flame"></div>
            <div class="match-head" id="head"></div>
            <div class="match-stick"></div>
        </div>
    </div>

    <div id="main-site">
        <h1 style="color: #ff00ff;">BALOCH MOVIES</h1>
        <p>Your content goes here...</p>
    </div>

    <script>
        // 1. Click Function: Intro se Matchstick par jane ke liye
        function startExperience() {
            const introHero = document.getElementById('intro-hero');
            const bgCanvas = document.getElementById('bgCanvas');
            const matchScreen = document.getElementById('match-screen');

            // Agar Intro screen active hai tabhi switch karein
            if (matchScreen.style.display !== 'flex' && document.getElementById('main-site').style.display !== 'block') {
                introHero.style.display = 'none';
                bgCanvas.style.display = 'none';
                matchScreen.style.display = 'flex';
                document.body.style.cursor = 'default';
            }
        }

        // 2. Matchstick Swipe Logic (Mobile & Desktop)
        const matchArea = document.getElementById('match-area');
        const head = document.getElementById('head');
        const flame = document.getElementById('flame');
        let startY = 0;

        matchArea.addEventListener('touchstart', (e) => { 
            e.stopPropagation(); // Click event ko trigger hone se rokta hai
            startY = e.touches[0].clientY; 
        });

        matchArea.addEventListener('touchmove', (e) => {
            let moveY = e.touches[0].clientY;
            if (Math.abs(startY - moveY) > 40) { ignite(); }
        });

        matchArea.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            matchArea.onmousemove = () => ignite();
        });

        function ignite() {
            head.style.background = '#333';
            flame.style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('match-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                document.body.style.overflow = 'auto';
            }, 1200);
        }
    </script>

    </body>
</html>
